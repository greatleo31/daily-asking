name: daily_asking
description: "晨昏证据图谱 —— 本地优先的职场证据成长助手（Daily Asking: local-first workplace evidence growth companion）。"
publish_to: 'none'
version: 1.1.1+10101

repository: https://github.com/greatleo31/daily-asking
homepage: https://github.com/greatleo31/daily-asking
issue_tracker: https://github.com/greatleo31/daily-asking/issues

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 轻量本地持久化（通过 Repository/Storage 抽象隔离，后续可替换为 SQLite/Drift）
  shared_preferences: ^2.3.0
  # 状态管理
  provider: ^6.1.2
  # OpenAI 兼容调用（可选 BYOK）
  http: ^1.2.0
  # 日期 / 中文本地化格式化
  intl: ^0.19.0
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/companion/day_01.png
    - assets/companion/day_07.png
    - assets/companion/day_14.png
    - assets/companion/day_30.png